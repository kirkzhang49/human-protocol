<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human Protocol Residential Furniture Viewer</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #13110e;
        color: #f4eddf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      .viewer {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        height: 100vh;
      }
      .panel {
        border-right: 1px solid rgba(244, 237, 223, 0.14);
        background: #18140f;
        padding: 16px;
        overflow-y: auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .sub {
        margin: 0 0 16px;
        color: #bcad99;
        font-size: 12px;
        line-height: 1.45;
      }
      .asset-list {
        display: grid;
        gap: 8px;
      }
      .asset {
        width: 100%;
        border: 1px solid rgba(244, 237, 223, 0.14);
        background: #211c16;
        color: #f4eddf;
        padding: 10px;
        text-align: left;
        border-radius: 6px;
        cursor: pointer;
      }
      .asset:hover,
      .asset.active {
        border-color: #c7a460;
        background: #2b241b;
      }
      .asset b {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 4px;
      }
      .asset span {
        display: block;
        color: #bcad99;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .stage {
        position: relative;
        min-width: 0;
        background:
          radial-gradient(circle at 68% 18%, rgba(255, 231, 188, 0.12), transparent 28%),
          linear-gradient(180deg, rgba(255, 245, 226, 0.08), transparent 38%),
          #0e0d0b;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 18px;
        bottom: 18px;
        right: 18px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        pointer-events: none;
      }
      .card {
        max-width: 560px;
        border: 1px solid rgba(244, 237, 223, 0.14);
        background: rgba(19, 17, 14, 0.84);
        padding: 12px 14px;
        border-radius: 6px;
        backdrop-filter: blur(8px);
      }
      .name {
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 4px;
      }
      .meta {
        color: #bcad99;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .hint {
        color: #bcad99;
        font-size: 12px;
      }
      @media (max-width: 820px) {
        .viewer {
          grid-template-columns: 1fr;
          grid-template-rows: 220px minmax(0, 1fr);
        }
        .panel {
          border-right: 0;
          border-bottom: 1px solid rgba(244, 237, 223, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <main class="viewer">
      <aside class="panel">
        <h1>住宅参照家具 3D 查看</h1>
        <p class="sub">Environment Asset Factory / residential_simulation。点击切换；拖拽旋转，滚轮缩放。</p>
        <div id="asset-list" class="asset-list"></div>
      </aside>
      <section class="stage">
        <canvas id="stage"></canvas>
        <div class="hud">
          <div class="card">
            <div id="asset-name" class="name">加载中</div>
            <div id="asset-meta" class="meta"></div>
          </div>
          <div class="hint">OrbitControls</div>
        </div>
      </section>
    </main>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
      import { MeshoptDecoder } from "three/examples/jsm/libs/meshopt_decoder.module.js";

      const residentialBase = "/src/assets/models-cooked/environment/props/";
      const level02Base = "/src/assets/models-cooked/environment/level02-furniture-image2/";
      const glbRevision = `residential-reference-batch01-${Date.now()}`;
      const assets = [
        {
          label: "看护沙发",
          key: "room_l2_img2_modular_sofa",
          group: "原有 Level2 住宅家具",
          note: "长低沙发、圆角坐垫、背部/底部隐藏控制暗示",
          urlBase: level02Base,
        },
        {
          label: "观察餐桌",
          key: "room_l2_img2_observation_dining_table",
          group: "原有 Level2 住宅家具",
          note: "餐桌/工作桌，薄台面、桌下暗缝",
          urlBase: level02Base,
        },
        {
          label: "儿童看护床",
          key: "room_l2_img2_nursery_bed",
          group: "原有 Level2 住宅家具",
          note: "软床垫、稀疏护栏、后部检修板",
          urlBase: level02Base,
        },
        {
          label: "全家福管制台",
          key: "room_l2_img2_family_portrait_console",
          group: "原有 Level2 住宅家具",
          note: "壁挂画框/浅柜，厚背板和底部槽",
          urlBase: level02Base,
        },
        {
          label: "服务厨房台",
          key: "room_l2_img2_service_kitchen_counter",
          group: "原有 Level2 住宅家具",
          note: "厨房台、抽屉、把手、水槽，控制感藏在背面",
          urlBase: level02Base,
        },
        {
          label: "衣柜扫描舱",
          key: "room_l2_img2_scanner_wardrobe",
          group: "原有 Level2 住宅家具",
          note: "双门衣柜，过度规整门缝和后板",
          urlBase: level02Base,
        },
        {
          label: "看护落地灯",
          key: "room_l2_img2_camera_lamp",
          group: "原有 Level2 住宅家具",
          note: "暖色落地灯，监控暗示只保留在小 collar",
          urlBase: level02Base,
        },
        {
          label: "尽头电梯饰柜",
          key: "room_l2_img2_living_end_elevator_fixture",
          group: "原有 Level2 住宅家具",
          note: "伪装成住宅内置柜的尽头装置",
          urlBase: level02Base,
        },
        {
          label: "观察书柜",
          key: "room_l2_img2_observation_bookshelf",
          group: "原有 Level2 住宅家具",
          note: "开放书架、克制书脊、隐藏后板",
          urlBase: level02Base,
        },
        {
          label: "看护单椅",
          key: "room_l2_img2_carekeeper_armchair",
          group: "原有 Level2 住宅家具",
          note: "软单椅、卷臂、靠背，后/底部暗示",
          urlBase: level02Base,
        },
        {
          label: "住宅圆角茶几",
          key: "hp_furniture_residential_oval_coffee_table_v1",
          group: "新增住宅参照家具",
          note: "圆角石面、双竖纹木墩、单条底部阴影缝",
          urlBase: residentialBase,
        },
        {
          label: "住宅竖纹边柜",
          key: "hp_furniture_residential_fluted_sideboard_v1",
          group: "新增住宅参照家具",
          note: "长边柜、竖纹门、暖石台面、背面检修盖",
          urlBase: residentialBase,
        },
        {
          label: "玄关储物换鞋凳",
          key: "hp_furniture_residential_entry_bench_cubby_v1",
          group: "新增住宅参照家具",
          note: "软垫、鞋格、挂钩墙板、过度规整暗缝",
          urlBase: residentialBase,
        },
        {
          label: "半高隔断书架",
          key: "hp_furniture_residential_room_divider_shelf_v1",
          group: "新增住宅参照家具",
          note: "开放格、克制书脊、后置小检修板",
          urlBase: residentialBase,
        },
        {
          label: "家政清洁储物柜",
          key: "hp_furniture_residential_cleaner_closet_v1",
          group: "新增住宅参照家具",
          note: "高窄暖白柜、竖纹门、加厚背板和底座",
          urlBase: residentialBase,
        },
      ].map((asset) => ({ ...asset, url: `${asset.urlBase}${asset.key}.glb?v=${glbRevision}` }));

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e0d0b);
      const camera = new THREE.PerspectiveCamera(42, 1, 0.03, 100);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI * 0.49;

      scene.add(new THREE.AmbientLight(0xfff0dc, 0.72));
      const hemi = new THREE.HemisphereLight(0xf3ecdf, 0x3a2818, 0.44);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffd6a1, 3.1);
      key.position.set(2.6, 3.6, 2.2);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 12;
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xc8aa7a, 0.54);
      fill.position.set(-2.2, 1.0, 2.8);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xf1e7d5, 0.24);
      rim.position.set(-3.0, 2.2, -2.6);
      scene.add(rim);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 8),
        new THREE.MeshStandardMaterial({
          color: 0x1b1711,
          roughness: 0.94,
          metalness: 0.0,
        }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.012;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(8, 32, 0xc7a460, 0x5c4e3a);
      grid.position.y = 0.002;
      scene.add(grid);

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      let current = null;
      const list = document.querySelector("#asset-list");
      const nameEl = document.querySelector("#asset-name");
      const metaEl = document.querySelector("#asset-meta");

      function resize() {
        const { clientWidth, clientHeight } = canvas.parentElement;
        renderer.setSize(clientWidth, clientHeight, false);
        camera.aspect = clientWidth / Math.max(1, clientHeight);
        camera.updateProjectionMatrix();
      }

      function frameObject(object) {
        object.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        object.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
        object.updateMatrixWorld(true);
        const maxDim = Math.max(size.x, size.y, size.z, 0.45);
        const fov = THREE.MathUtils.degToRad(camera.fov);
        const distance = (maxDim * 0.5) / Math.tan(fov * 0.5) * 1.82;
        const targetY = Math.max(0.18, size.y * 0.46);
        camera.position.set(distance * 0.62, targetY + distance * 0.34, distance * 0.86);
        camera.near = Math.max(0.01, distance / 120);
        camera.far = distance * 10 + 10;
        camera.lookAt(0, targetY, 0);
        camera.updateProjectionMatrix();
        controls.target.set(0, targetY, 0);
        controls.update();
        const active = assets.find((item) => item.label === nameEl.dataset.pendingLabel);
        metaEl.textContent = `${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}m${active?.note ? " · " + active.note : ""}`;
      }

      async function loadAsset(asset) {
        nameEl.dataset.pendingLabel = asset.label;
        nameEl.textContent = `加载 ${asset.label}...`;
        for (const button of list.querySelectorAll("button")) {
          button.classList.toggle("active", button.dataset.key === asset.key);
        }
        if (current) {
          scene.remove(current);
          current.traverse((node) => {
            if (node.geometry) node.geometry.dispose?.();
          });
          current = null;
        }
        const gltf = await loader.loadAsync(asset.url);
        current = gltf.scene;
        current.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
        scene.add(current);
        frameObject(current);
        nameEl.textContent = asset.label;
      }

      for (const asset of assets) {
        const button = document.createElement("button");
        button.className = "asset";
        button.dataset.key = asset.key;
        button.innerHTML = `<b>${asset.label}</b><span>${asset.group}</span><span>${asset.key}</span><span>${asset.note}</span>`;
        button.addEventListener("click", () => loadAsset(asset));
        list.appendChild(button);
      }

      window.addEventListener("resize", resize);
      resize();
      await loadAsset(assets[0]);

      function tick() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
